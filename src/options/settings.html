<!doctype html>
<html lang="en" data-page="settings">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >
    <title>Lens settings</title><style id="settings-styles">
      :root { --line:#e5e7eb; --muted:#6b7280; --ink:#111827; --panel:#fff; --surface:#f9fafb; color-scheme:light dark; }
      @media (prefers-color-scheme:dark) { :root { --line:#374151; --muted:#9ca3af; --ink:#f9fafb; --panel:#1f2937; --surface:#111827; } }
      #settings-page { max-width:640px; margin:0 auto; padding:2rem 1.5rem; color:var(--ink); background:var(--surface); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
      header { display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin-bottom:1.5rem; }
      h1 { margin:0; font-size:1.375rem; }
      section { margin-bottom:1rem; padding:1rem 1.125rem; border:1px solid var(--line); border-radius:.5rem; background:var(--panel); }
      .row { display:flex; align-items:center; gap:.625rem; cursor:pointer; }
      .row input[type="number"] { width:4.5rem; padding:.25rem .5rem; border:1px solid var(--line); border-radius:.375rem; color:inherit; background:transparent; font:inherit; }
      .muted { margin:.5rem 0 0; color:var(--muted); font-size:.875rem; }
    </style></head>
  <body id="settings-page">
    <div id="app" data-view="settings"></div>
    <script type="module" src="./settings.ts"></script>
  </body></html>
